version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/app_data/database.db
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - GOOGLE_API_KEY=
      - GOOGLE_CX=
    volumes:
      - ./app_data:/app/app_data
      - ./uploaded_documents:/app/uploaded_documents

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
